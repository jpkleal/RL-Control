#!/usr/bin/env bash
# manifest.conf - single source of truth for repos, branches, and shared dirs.
# This file is sourced by setup.sh and run.sh - it is not meant to be executed directly.

# Repos to manage: "name|git_url|branch|local_folder"
REPOS=(
  "LyNCh|https://github.com/project-neon/LyNCh.git|main|LyNCh"
  "RL-Engine|https://github.com/jpkleal/RL-Engine.git|main|RL-Engine"
  "NeonFC-SSL|https://github.com/project-neon/NeonFC-SSL.git|feat/drl|NeonFC-SSL"
)

# Real directories that live inside this control repo, under ./shared/.
# These are the actual data; every project reaches them through a symlink.
SHARED_DIRS=(
  "results"
  "models"
)

# Symlinks to create: "path_inside_this_repo|shared_dir_name"
# path_inside_this_repo is relative to this control repo's root
# (i.e. it will end up as <folder>/<path> -> shared/<shared_dir_name>)
SYMLINKS=(
  "LyNCh/results|results"
  "RL-Engine/results|results"
  "NeonFC-SSL/models|models"
  "RL-Engine/runs/training/current|models"
)

# Run stages, used by run.sh. Each stage is one string; within a stage,
# entries separated by ';' run in PARALLEL, and the stage waits for all of
# them to finish before the next stage starts. Each entry is "folder|command".
#
# All 3 run concurrently.
RUN_STAGES=(
  "LyNCh|poetry run lynch;NeonFC-SSL|poetry run neonfc --profile ../configs/neonfc.toml;RL-Engine|poetry run train --config ../configs/rlengine.toml"
)
