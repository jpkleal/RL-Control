#!/usr/bin/env bash
# manifest.conf - single source of truth for repos, versions, and shared dirs.
# This file is sourced by setup.sh and run.sh - it is not meant to be executed directly.

# Tag checked out in every repo whose entry below leaves its own tag empty.
# Create the same (annotated) tag in all 3 repos and push it, then set it here.
# Empty = follow the tip of each repo's branch (development mode, NOT reproducible).
EXPERIMENT_TAG=""

# Required tool versions (major.minor). setup.sh aborts if the machine differs.
PYTHON_VERSION="3.12"   # only version accepted by all 3 pyproject.toml files
POETRY_VERSION="2.2"    # version that generated the 3 poetry.lock files

# Repos to manage: "name|git_url|branch|tag|local_folder"
# tag: empty = use EXPERIMENT_TAG; if that is also empty, follow the branch tip.
REPOS=(
  "LyNCh|https://github.com/project-neon/LyNCh.git|feat/metrics||LyNCh"
  "RL-Engine|https://github.com/jpkleal/RL-Engine.git|feat/metrics||RL-Engine"
  "NeonFC-SSL|https://github.com/project-neon/NeonFC-SSL.git|feat/metrics||NeonFC-SSL"
)

# Real directories that live inside this control repo, under ./shared/.
# These are the actual data; every project reaches them through a symlink.
SHARED_DIRS=(
  "results"
  "models"
)

# Symlinks to create: "path_inside_this_repo|shared_dir_name"
# path_inside_this_repo is relative to this control repo's root
# (i.e. it will end up as <folder>/<path> -> shared/<shared_dir_name>)
SYMLINKS=(
  "LyNCh/results|results"
  "RL-Engine/results|results"
  "NeonFC-SSL/runs/training/current|models"
  "RL-Engine/runs/training/current|models"
)

# Run stages, used by run.sh. Each stage is one string; within a stage,
# entries separated by ';' run in PARALLEL, and the stage waits for all of
# them to finish before the next stage starts. Each entry is "folder|command".
#
# All 3 run concurrently.
RUN_STAGES=(
  "LyNCh|poetry run lynch;NeonFC-SSL|poetry run neonfc --profile ../configs/neonfc.toml;RL-Engine|poetry run train --config ../configs/rlengine.toml"
)
